        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>

  <div class="search-panel" id="searchPanel">
    <input type="text" class="search-input" id="searchInput" placeholder="Search products..." autocomplete="off" />
    <div class="search-results" id="searchResults"></div>
  </div>

  <main>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span>/</span>
      <span>Accessories</span>
    </nav>

    <header class="page-header">
      <h1 class="page-title">Accessories</h1>
      <p class="page-count" id="pageCount"></p>
    </header>

    <section class="product-grid" id="productGrid"></section>
  </main>

  <script src="store.js"></script>
  <script>
    async function loadProducts() {
      const products = await fetch('/api/products?type=accessories').then(r => r.json());
      const grid = document.getElementById('productGrid');

      const count = document.getElementById('pageCount');
      count.textContent = products.length
        ? `${products.length} ${products.length === 1 ? 'piece' : 'pieces'}`
        : '';

      if (!products.length) {
        grid.innerHTML = '<p style="padding:80px 0;text-align:center;color:#888;font-size:13px;">No accessories yet.</p>';
        return;
      }

      grid.innerHTML = products.map(p => `
        <article class="product-card">
          <a href="product.html?id=${p.id}" class="product-image-link">
            <img src="${cloudinaryUrl(p.image, 600)}" srcset="${cloudinarySrcset(p.image, [200, 300, 400, 600, 800])}" sizes="(max-width: 768px) 50vw, 33vw" alt="${p.name}" loading="lazy" />
          </a>
          <a href="product.html?id=${p.id}" class="product-info">
            <span class="product-name">${p.name}</span>
            <span class="product-price">${formatPrice(p.price)}</span>
          </a>
        </article>
      `).join('');
    }

    loadProducts();
    Store.updateBadge();
  </script>

    </div>
