  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="navbar">
    <a href="index.html" class="brand">MARTA</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="#">New In</a>
      <a href="#">Shop</a>
      <a href="#">Sale</a>
    </nav>
    <div class="nav-icons">
      <a href="#" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </a>
      <a href="wishlist.html" aria-label="Wishlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </a>
      <a href="cart.html" aria-label="Cart" class="nav-cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-badge" style="display:none">0</span>
      </a>
    </div>
  </header>

  <main class="wishlist-page">

    <div class="empty-state" id="emptyState" hidden>
      <p class="empty-title">Your wishlist is empty</p>
      <a href="index.html" class="empty-cta">Browse Items</a>
    </div>

    <div class="wishlist-grid" id="wishlistGrid"></div>

  </main>

  <div id="toast" class="toast"></div>

  <script src="store.js"></script>
  <script>
    const wishlistGridEl = document.getElementById('wishlistGrid');
    const emptyStateEl   = document.getElementById('emptyState');

    async function renderWishlist() {
      const list = await Store.getWishlist();

      if (list.length === 0) {
        emptyStateEl.hidden = false;
        wishlistGridEl.innerHTML = '';
        return;
      }

      emptyStateEl.hidden = true;
      wishlistGridEl.innerHTML = list.map(item => `
        <article class="wishlist-card" data-item-id="${item.id}">
          <a href="product.html" class="product-image-link">
            <img src="${item.image}" alt="${item.name}" />
          </a>
          <div class="product-info" style="text-decoration:none;color:inherit;">
            <span class="product-name">${item.name}</span>
            <span class="product-price">€${item.price.toFixed(2)}</span>
          </div>
          <p class="wishlist-meta">${item.color} · ${item.size}</p>
          <div class="wishlist-actions">
            <button class="btn-wl-cart">Add to Cart</button>
            <button class="btn-wl-remove">Remove</button>
          </div>
        </article>
      `).join('');
    }

    wishlistGridEl.addEventListener('click', async e => {
      const card = e.target.closest('.wishlist-card');
      if (!card) return;
      const itemId = parseInt(card.dataset.itemId);
      const list = await Store.getWishlist();
      const item = list.find(i => i.id === itemId);
      if (!item) return;

      if (e.target.classList.contains('btn-wl-cart')) {
        await Store.addToCart({ id: item.productId, name: item.name, price: item.price, image: item.image, color: item.color, size: item.size });
        showToast('Added to cart');
        return;
      }

      if (e.target.classList.contains('btn-wl-remove')) {
        await Store.removeFromWishlist(itemId);
        await renderWishlist();
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    renderWishlist();
    Store.updateBadge();
  </script>

</body>
