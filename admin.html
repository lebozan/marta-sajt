<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — MARTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f9f9f9;
      color: #111;
      -webkit-font-smoothing: antialiased;
    }

    .admin-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 40px;
    }

    h2 {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #666;
      margin-bottom: 16px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e5e5;
      padding: 28px;
      margin-bottom: 32px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #666;
    }

    input[type="text"],
    input[type="number"],
    input[type="file"],
    select {
      height: 40px;
      border: 1px solid #e5e5e5;
      padding: 0 12px;
      font-family: inherit;
      font-size: 13px;
      color: #111;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input:focus, select:focus { border-color: #111; }
    input[type="file"] { padding: 8px 12px; height: auto; cursor: pointer; }

    .btn {
      height: 40px;
      padding: 0 20px;
      background: #111;
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover { background: #333; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }

    .btn-outline {
      background: #fff;
      color: #111;
      border: 1px solid #e5e5e5;
    }

    .btn-outline:hover { border-color: #111; background: #fff; }

    .upload-result {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
      word-break: break-all;
    }

    .upload-result img {
      display: block;
      width: 120px;
      aspect-ratio: 4/5;
      object-fit: cover;
      margin-top: 8px;
      border: 1px solid #e5e5e5;
    }

    .status {
      font-size: 12px;
      margin-top: 12px;
      padding: 10px 14px;
      background: #f0faf0;
      border: 1px solid #c3e6c3;
      color: #2a6a2a;
      display: none;
    }

    .status.error {
      background: #fff0f0;
      border-color: #e6c3c3;
      color: #6a2a2a;
    }

    .product-list { display: flex; flex-direction: column; gap: 12px; }

    .product-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      border: 1px solid #e5e5e5;
      background: #fff;
    }

    .product-row img {
      width: 48px;
      aspect-ratio: 4/5;
      object-fit: cover;
      flex-shrink: 0;
    }

    .product-row-info { flex: 1; }
    .product-row-name { font-size: 13px; font-weight: 500; }
    .product-row-price { font-size: 12px; color: #666; margin-top: 2px; }
    .product-row-id { font-size: 11px; color: #aaa; margin-top: 2px; font-family: monospace; }

    textarea {
      border: 1px solid #e5e5e5;
      padding: 8px 12px;
      font-family: inherit;
      font-size: 13px;
      color: #111;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      resize: vertical;
    }
    textarea:focus { border-color: #111; }

    .slide-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px;
      border: 1px solid #e5e5e5;
      background: #fff;
      margin-bottom: 8px;
    }
    .slide-row img { width: 80px; height: 50px; object-fit: cover; flex-shrink: 0; }
    .slide-row-info { flex: 1; min-width: 0; }
    .slide-row-eyebrow { font-size: 11px; color: #c9607a; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; }
    .slide-row-heading { font-size: 13px; font-weight: 500; margin-top: 2px; }
    .slide-row-cta { font-size: 11px; color: #888; margin-top: 2px; }
    .slide-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .image-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .img-item { display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #e5e5e5; }
    .img-item img { width: 52px; height: 65px; object-fit: cover; flex-shrink: 0; }
    .img-item-label { font-size: 11px; color: #888; flex: 1; }
  </style>
</head>
<body>

  <div class="admin-wrap">
    <h1>MARTA — Admin</h1>

    <!-- Create product -->
    <div class="card">
      <h2>Create Product</h2>
      <div class="field">
        <label>Name</label>
        <input type="text" id="productName" placeholder="e.g. Linen Blazer" />
      </div>
      <div class="field">
        <label>Price (€)</label>
        <input type="number" id="productPrice" placeholder="e.g. 129" min="0" step="0.01" />
      </div>
      <div class="field">
        <label>Type</label>
        <select id="productType">
          <option value="dress">Dress</option>
          <option value="miraz">Miraz</option>
        </select>
      </div>
      <div class="field">
        <label>Images <span style="font-weight:400;color:#aaa">(first = primary)</span></label>
        <div class="image-list" id="productImageList"></div>
        <div style="display:flex;gap:8px;">
          <input type="file" id="productImageFile" accept="image/*" style="display:none" />
          <button class="btn btn-outline" id="productUploadBtn">Upload</button>
          <input type="text" id="productImageUrl" placeholder="or paste URL" style="flex:1;" />
          <button class="btn btn-outline" id="productAddUrlBtn">Add</button>
        </div>
      </div>
      <button class="btn" id="createBtn">Create Product</button>
      <div class="status" id="createStatus"></div>
    </div>

    <!-- Product list -->
    <div class="card">
      <h2>Products</h2>
      <div class="product-list" id="productList">
        <p style="font-size:13px;color:#888;">Loading...</p>
      </div>
    </div>

    <!-- Edit product -->
    <div class="card" id="editCard" style="display:none;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;">
        <h2 style="margin:0;">Edit Product</h2>
        <button class="btn btn-outline" id="editCancelBtn">Cancel</button>
      </div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="editName" />
      </div>
      <div class="field">
        <label>Price (€)</label>
        <input type="number" id="editPrice" min="0" step="0.01" />
      </div>
      <div class="field">
        <label>Type</label>
        <select id="editType">
          <option value="dress">Dress</option>
          <option value="miraz">Miraz</option>
        </select>
      </div>
      <div class="field">
        <label>Images <span style="font-weight:400;color:#aaa">(first = primary)</span></label>
        <div class="image-list" id="editImageList"></div>
        <div style="display:flex;gap:8px;">
          <input type="file" id="editImageFile" accept="image/*" style="display:none" />
          <button class="btn btn-outline" id="editUploadBtn">Upload</button>
          <input type="text" id="editImageUrl" placeholder="or paste URL" style="flex:1;" />
          <button class="btn btn-outline" id="editAddUrlBtn">Add</button>
        </div>
      </div>
      <button class="btn" id="saveEditBtn">Save Changes</button>
      <div class="status" id="editStatus"></div>
    </div>

    <!-- Carousel slides -->
    <div class="card">
      <h2>Carousel</h2>

      <div id="slideList" style="margin-bottom:24px;">
        <p style="font-size:13px;color:#888;">Loading...</p>
      </div>

      <div style="border-top:1px solid #e5e5e5;padding-top:24px;">
        <h2 style="margin-bottom:16px;">Add Slide</h2>
        <div class="field">
          <label>Image</label>
          <div style="display:flex;gap:8px;">
            <input type="text" id="slideImage" placeholder="Paste URL or upload" style="flex:1;" />
            <input type="file" id="slideFile" accept="image/*" style="display:none" />
            <button class="btn btn-outline" id="slideUploadBtn">Upload</button>
          </div>
          <div id="slideUploadResult" style="display:none;font-size:12px;color:#666;margin-top:6px;"></div>
        </div>
        <div class="field">
          <label>Eyebrow</label>
          <input type="text" id="slideEyebrow" placeholder="e.g. New Arrivals" />
        </div>
        <div class="field">
          <label>Heading (Enter = line break on site)</label>
          <textarea id="slideHeading" rows="2" placeholder="e.g. Spring&#10;Collection"></textarea>
        </div>
        <div class="field">
          <label>Button Label</label>
          <input type="text" id="slideCtaLabel" placeholder="Shop Now" />
        </div>
        <div class="field">
          <label>Button Link</label>
          <input type="text" id="slideCtaLink" placeholder="dresses.html" />
        </div>
        <button class="btn" id="addSlideBtn">Add Slide</button>
        <div class="status" id="slideStatus"></div>
      </div>
    </div>
  </div>

  <script>
    const createBtn    = document.getElementById('createBtn');
    const createStatus = document.getElementById('createStatus');
    const productList  = document.getElementById('productList');

    // ── Multi-image management ──

    let productImages = [];

    function renderProductImages() {
      const listEl = document.getElementById('productImageList');
      if (!productImages.length) {
        listEl.innerHTML = '<p style="font-size:12px;color:#aaa;margin-bottom:4px;">No images yet.</p>';
        return;
      }
      listEl.innerHTML = productImages.map((url, i) => `
        <div class="img-item" data-index="${i}">
          <img src="${url}" alt="" />
          <span class="img-item-label">${i === 0 ? 'Primary' : `Image ${i + 1}`}</span>
          <button class="btn btn-outline img-remove-btn" style="padding:0 12px;">×</button>
        </div>
      `).join('');
    }

    document.getElementById('productImageList').addEventListener('click', e => {
      if (!e.target.classList.contains('img-remove-btn')) return;
      const idx = parseInt(e.target.closest('.img-item').dataset.index);
      productImages.splice(idx, 1);
      renderProductImages();
    });

    document.getElementById('productUploadBtn').addEventListener('click', () => {
      document.getElementById('productImageFile').click();
    });

    document.getElementById('productImageFile').addEventListener('change', async () => {
      const file = document.getElementById('productImageFile').files[0];
      if (!file) return;
      const btn = document.getElementById('productUploadBtn');
      btn.disabled = true;
      btn.textContent = 'Uploading...';
      const fd = new FormData();
      fd.append('image', file);
      const r = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await r.json();
      btn.disabled = false;
      btn.textContent = 'Upload';
      if (data.url) {
        productImages.push(data.url);
        renderProductImages();
        document.getElementById('productImageFile').value = '';
      }
    });

    document.getElementById('productAddUrlBtn').addEventListener('click', () => {
      const url = document.getElementById('productImageUrl').value.trim();
      if (!url) return;
      productImages.push(url);
      renderProductImages();
      document.getElementById('productImageUrl').value = '';
    });

    // Create product
    createBtn.addEventListener('click', async () => {
      const name  = document.getElementById('productName').value.trim();
      const price = parseFloat(document.getElementById('productPrice').value);
      const type  = document.getElementById('productType').value;

      if (!name || !price || !productImages.length) {
        return showStatus(createStatus, 'Fill in all fields and add at least one image.', true);
      }

      const r    = await fetch('/api/products', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ name, price, images: productImages, type }),
      });
      const data = await r.json();

      if (data.id) {
        showStatus(createStatus, `Product created — ID: ${data.id}`);
        document.getElementById('productName').value  = '';
        document.getElementById('productPrice').value = '';
        productImages = [];
        renderProductImages();
        loadProducts();
      } else {
        showStatus(createStatus, 'Error: ' + JSON.stringify(data), true);
      }
    });

    // Load product list
    let cachedProducts = [];

    async function loadProducts() {
      cachedProducts = await fetch('/api/products').then(r => r.json());

      if (!cachedProducts.length) {
        productList.innerHTML = '<p style="font-size:13px;color:#888;">No products yet.</p>';
        return;
      }

      productList.innerHTML = cachedProducts.map(p => `
        <div class="product-row" data-id="${p.id}">
          <img src="${p.image}" alt="${p.name}" />
          <div class="product-row-info">
            <div class="product-row-name">${p.name}</div>
            <div class="product-row-price">€${p.price.toFixed(2)} · ${p.type}${p.images && p.images.length > 1 ? ` · ${p.images.length} images` : ''}</div>
            <div class="product-row-id">${p.id}</div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-outline edit-btn">Edit</button>
            <button class="btn btn-outline delete-btn">Delete</button>
          </div>
        </div>
      `).join('');
    }

    productList.addEventListener('click', async e => {
      const row = e.target.closest('.product-row');
      if (!row) return;
      if (e.target.classList.contains('delete-btn')) {
        if (!confirm('Delete this product?')) return;
        await fetch(`/api/products/${row.dataset.id}`, { method: 'DELETE' });
        loadProducts();
      } else if (e.target.classList.contains('edit-btn')) {
        const product = cachedProducts.find(p => p.id === row.dataset.id);
        if (product) openEdit(product);
      }
    });

    // ── Edit product ──

    let editImages  = [];
    let editingId   = null;

    function renderEditImages() {
      const listEl = document.getElementById('editImageList');
      if (!editImages.length) {
        listEl.innerHTML = '<p style="font-size:12px;color:#aaa;margin-bottom:4px;">No images yet.</p>';
        return;
      }
      listEl.innerHTML = editImages.map((url, i) => `
        <div class="img-item" data-index="${i}">
          <img src="${url}" alt="" />
          <span class="img-item-label">${i === 0 ? 'Primary' : `Image ${i + 1}`}</span>
          <button class="btn btn-outline img-remove-btn" style="padding:0 12px;">×</button>
        </div>
      `).join('');
    }

    function openEdit(product) {
      editingId   = product.id;
      editImages  = product.images && product.images.length ? [...product.images] : [product.image];
      document.getElementById('editName').value  = product.name;
      document.getElementById('editPrice').value = product.price;
      document.getElementById('editType').value  = product.type;
      document.getElementById('editStatus').style.display = 'none';
      renderEditImages();
      const card = document.getElementById('editCard');
      card.style.display = 'block';
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    document.getElementById('editCancelBtn').addEventListener('click', () => {
      document.getElementById('editCard').style.display = 'none';
      editingId = null;
    });

    document.getElementById('editImageList').addEventListener('click', e => {
      if (!e.target.classList.contains('img-remove-btn')) return;
      const idx = parseInt(e.target.closest('.img-item').dataset.index);
      editImages.splice(idx, 1);
      renderEditImages();
    });

    document.getElementById('editUploadBtn').addEventListener('click', () => {
      document.getElementById('editImageFile').click();
    });

    document.getElementById('editImageFile').addEventListener('change', async () => {
      const file = document.getElementById('editImageFile').files[0];
      if (!file) return;
      const btn = document.getElementById('editUploadBtn');
      btn.disabled = true;
      btn.textContent = 'Uploading...';
      const fd = new FormData();
      fd.append('image', file);
      const r = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await r.json();
      btn.disabled = false;
      btn.textContent = 'Upload';
      if (data.url) {
        editImages.push(data.url);
        renderEditImages();
        document.getElementById('editImageFile').value = '';
      }
    });

    document.getElementById('editAddUrlBtn').addEventListener('click', () => {
      const url = document.getElementById('editImageUrl').value.trim();
      if (!url) return;
      editImages.push(url);
      renderEditImages();
      document.getElementById('editImageUrl').value = '';
    });

    document.getElementById('saveEditBtn').addEventListener('click', async () => {
      const name   = document.getElementById('editName').value.trim();
      const price  = parseFloat(document.getElementById('editPrice').value);
      const type   = document.getElementById('editType').value;
      const status = document.getElementById('editStatus');

      if (!name || !price || !editImages.length) {
        return showStatus(status, 'Fill in all fields and keep at least one image.', true);
      }

      const r = await fetch(`/api/products/${editingId}`, {
        method:  'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ name, price, images: editImages, type }),
      });
      const data = await r.json();

      if (data.id) {
        showStatus(status, 'Product updated.');
        document.getElementById('editCard').style.display = 'none';
        editingId = null;
        loadProducts();
      } else {
        showStatus(status, 'Error: ' + JSON.stringify(data), true);
      }
    });

    function showStatus(el, msg, isError = false) {
      el.textContent = msg;
      el.className   = 'status' + (isError ? ' error' : '');
      el.style.display = 'block';
    }

    renderProductImages();
    loadProducts();

    // ── Carousel slides ──

    async function loadSlides() {
      const slides = await fetch('/api/carousel').then(r => r.json());
      const list = document.getElementById('slideList');
      if (!slides.length) {
        list.innerHTML = '<p style="font-size:13px;color:#888;">No slides yet.</p>';
        return;
      }
      list.innerHTML = slides.map(s => `
        <div class="slide-row" data-id="${s.id}">
          <img src="${s.image}" alt="${s.eyebrow}" />
          <div class="slide-row-info">
            <div class="slide-row-eyebrow">${s.eyebrow}</div>
            <div class="slide-row-heading">${s.heading.replace(/\n/g, ' / ')}</div>
            <div class="slide-row-cta">${s.ctaLabel} → ${s.ctaLink}</div>
          </div>
          <div class="slide-row-actions">
            <button class="btn btn-outline move-up-btn" title="Move up">↑</button>
            <button class="btn btn-outline move-down-btn" title="Move down">↓</button>
            <button class="btn btn-outline delete-slide-btn">Delete</button>
          </div>
        </div>
      `).join('');
    }

    document.getElementById('slideList').addEventListener('click', async e => {
      const row = e.target.closest('.slide-row');
      if (!row) return;
      const id = row.dataset.id;
      if (e.target.classList.contains('delete-slide-btn')) {
        if (!confirm('Delete this slide?')) return;
        await fetch(`/api/carousel/${id}`, { method: 'DELETE' });
        loadSlides();
      } else if (e.target.classList.contains('move-up-btn')) {
        await fetch(`/api/carousel/${id}/move`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ direction: 'up' }) });
        loadSlides();
      } else if (e.target.classList.contains('move-down-btn')) {
        await fetch(`/api/carousel/${id}/move`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ direction: 'down' }) });
        loadSlides();
      }
    });

    document.getElementById('slideUploadBtn').addEventListener('click', () => {
      document.getElementById('slideFile').click();
    });

    document.getElementById('slideFile').addEventListener('change', async () => {
      const file = document.getElementById('slideFile').files[0];
      if (!file) return;
      const btn = document.getElementById('slideUploadBtn');
      const resultEl = document.getElementById('slideUploadResult');
      btn.disabled = true;
      btn.textContent = 'Uploading...';
      const fd = new FormData();
      fd.append('image', file);
      const r = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await r.json();
      btn.disabled = false;
      btn.textContent = 'Upload';
      if (data.url) {
        document.getElementById('slideImage').value = data.url;
        resultEl.style.display = 'block';
        resultEl.innerHTML = `<img src="${data.url}" style="width:120px;height:75px;object-fit:cover;margin-top:6px;border:1px solid #e5e5e5;" />`;
      }
    });

    document.getElementById('addSlideBtn').addEventListener('click', async () => {
      const image    = document.getElementById('slideImage').value.trim();
      const eyebrow  = document.getElementById('slideEyebrow').value.trim();
      const heading  = document.getElementById('slideHeading').value.trim();
      const ctaLabel = document.getElementById('slideCtaLabel').value.trim();
      const ctaLink  = document.getElementById('slideCtaLink').value.trim();
      const status   = document.getElementById('slideStatus');
      if (!image) return showStatus(status, 'Image URL is required.', true);
      const r = await fetch('/api/carousel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ image, eyebrow, heading, ctaLabel, ctaLink }),
      });
      const data = await r.json();
      if (data.id) {
        showStatus(status, 'Slide added.');
        document.getElementById('slideImage').value    = '';
        document.getElementById('slideEyebrow').value  = '';
        document.getElementById('slideHeading').value  = '';
        document.getElementById('slideCtaLabel').value = '';
        document.getElementById('slideCtaLink').value  = '';
        document.getElementById('slideUploadResult').style.display = 'none';
        loadSlides();
      } else {
        showStatus(status, 'Error: ' + JSON.stringify(data), true);
      }
    });

    loadSlides();
  </script>

</body>
</html>
