<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-center">
      <a href="dresses.html" class="nav-link">Dresses</a>
      <a href="index.html" class="nav-logo">
        <img src="https://res.cloudinary.com/dkcha41gs/image/upload/v1777981668/marta/ugkc4goltm8lwr2ca2iz.png" alt="MARTA" class="nav-logo-img" />
      </a>
      <a href="miraz.html" class="nav-link">Miraz</a>
    </div>
    <div class="nav-icons">
      <a href="#" aria-label="Search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </a>
      <a href="wishlist.html" aria-label="Wishlist">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
        </svg>
      </a>
      <a href="cart.html" aria-label="Cart" class="nav-cart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span class="cart-badge" style="display:none">0</span>
      </a>
    </div>
  </header>

  <main>
    <section class="product-grid" id="productGrid"></section>
  </main>

  <script src="store.js"></script>
  <script>
    async function loadProducts() {
      const products = await fetch('/api/products?type=miraz').then(r => r.json());
      const grid = document.getElementById('productGrid');

      if (!products.length) {
        grid.innerHTML = '<p style="padding:80px 0;text-align:center;color:#888;font-size:13px;">No items yet.</p>';
        return;
      }

      grid.innerHTML = products.map(p => `
        <article class="product-card">
          <a href="product.html?id=${p.id}" class="product-image-link">
            <img src="${p.image}" alt="${p.name}" />
          </a>
          <a href="product.html?id=${p.id}" class="product-info">
            <span class="product-name">${p.name}</span>
            <span class="product-price">€${p.price.toFixed(2)}</span>
          </a>
        </article>
      `).join('');
    }

    loadProducts();
    Store.updateBadge();
  </script>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-col">
        <p class="footer-heading">Company</p>
        <a href="#">About Us</a>
        <a href="#">Contact</a>
        <a href="#">Careers</a>
      </div>
      <div class="footer-col">
        <p class="footer-heading">Shopping</p>
        <a href="#">Delivery &amp; Shipping</a>
        <a href="#">Returns &amp; Exchanges</a>
        <a href="#">Size Guide</a>
      </div>
      <div class="footer-col">
        <p class="footer-heading">Legal</p>
        <a href="#">Privacy Policy</a>
        <a href="#">Terms &amp; Conditions</a>
        <a href="#">Cookie Policy</a>
      </div>
    </div>
    <div class="footer-bottom">
      <span>&copy; 2025 MARTA. All rights reserved.</span>
    </div>
  </footer>

</body>
</html>
