  <main class="sketch-page">

    <div class="sketch-inputs">

          <option value="">Size</option>

      </div>
      <p class="sketch-subtitle">Enter your measurements in cm</p>

      <div class="sketch-field">
        <label for="bust">Bust</label>
        <div class="sketch-input-wrap">
          <input type="number" id="bust" min="50" max="200" step="0.5" value="90" />

      <div class="sketch-field">
        <label for="underbust">Underbust</label>
        <div class="sketch-input-wrap">
          <input type="number" id="underbust" min="40" max="180" step="0.5" value="74" />

      <div class="sketch-field">
        <label for="waist">Waist</label>
        <div class="sketch-input-wrap">
          <input type="number" id="waist" min="40" max="180" step="0.5" value="68" />

      <div class="sketch-field">

        <div class="sketch-input-wrap">

    <div class="sketch-canvas">
      <svg id="bodySvg" viewBox="0 0 300 580" role="img" aria-label="Interactive female body measurement sketch" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

  </main>

  <script src="store.js"></script>
  <script>
    // ── Drawing constants ────────────────────────────────────────────
    const CX          = 150;
    const SCALE       = 3.5;

    const NECK_HW     = 10;
    const HEAD_Y      = 38;
    const HEAD_R      = 22;
    const NECK_TOP_Y  = 60;   // = HEAD_Y + HEAD_R
    const SHOULDER_Y  = 92;
    const ARMPIT_Y    = 122;
    const BUST_Y      = 152;
    const UNDERBUST_Y = 184;
    const WAIST_Y     = 234;
    const HIP_Y       = 294;
    const CROTCH_Y    = 328;
    const KNEE_Y      = 428;
    const ANKLE_Y     = 510;

    const TOE_EXT     = 12;   // how far toe extends beyond outer ankle
    const FOOT_H      = 20;   // vertical height of foot
    const ELBOW_Y     = 262;
    const WRIST_Y     = 275;

    // ── Helpers ──────────────────────────────────────────────────────
    function hw(cm)          { return cm / (2 * Math.PI) * SCALE; }
    function pt(xOff, y)     { return `${(CX + xOff).toFixed(1)},${y}`; }
    function C(c1, c2, end)  { return `C ${c1} ${c2} ${end}`; }

    // ── Main draw ────────────────────────────────────────────────────
    function drawBodyLegacy(bust, underbust, waist, hips) {
      const bHW = hw(bust);
      const uHW = hw(underbust);
      const wHW = hw(waist);
      const hHW = hw(hips);
      const sHW = bHW * 0.97;     // shoulders ≈ bust (hips become widest point)
      const aHW = bHW * 0.76;     // deep armhole — creates pronounced breast curve

      // Leg geometry — slim and tapered
      const lgap   = hHW * 0.20;
      const lKnee  = hHW * 0.70;
      const lAnkl  = hHW * 0.52;
      const liKnee = lgap * 0.90;
      const liAnkl = lgap * 0.86;

      // ── Torso path ───────────────────────────────────────────────
      const torso = [
        `M ${pt(NECK_HW, NECK_TOP_Y)}`,

        // right neck → right shoulder
        C(pt(NECK_HW + 18, NECK_TOP_Y + 7),
          pt(sHW + 2,       SHOULDER_Y - 6),
          pt(sHW,           SHOULDER_Y)),

        // right shoulder → right armpit (deep armhole slope)
        C(pt(sHW + 2,  SHOULDER_Y + 22),
          pt(aHW + 5,  ARMPIT_Y - 10),
          pt(aHW,      ARMPIT_Y)),

        // right armpit → right bust (dramatic outward — breast curve)
        C(pt(aHW - 8,  ARMPIT_Y + 12),
          pt(bHW + 12, BUST_Y - 6),
          pt(bHW,      BUST_Y)),

        // right bust → right underbust (taper)
        C(pt(bHW + 3,  BUST_Y + 14),
          pt(uHW + 3,  UNDERBUST_Y - 14),
          pt(uHW,      UNDERBUST_Y)),

        // right underbust → right waist (pronounced inward)
        C(pt(uHW + 6,  UNDERBUST_Y + 22),
          pt(wHW + 8,  WAIST_Y - 22),
          pt(wHW,      WAIST_Y)),

        // right waist → right hip (pronounced outward sweep)
        C(pt(wHW + 8,  WAIST_Y + 26),
          pt(hHW + 6,  HIP_Y - 26),
          pt(hHW,      HIP_Y)),

        // right hip → crotch (rounded lower hip)
        C(pt(hHW + 4,  HIP_Y + 14),
          pt(hHW + 2,  CROTCH_Y - 10),
          pt(hHW,      CROTCH_Y)),

        // across crotch bottom
        `L ${pt(-hHW, CROTCH_Y)}`,

        // ── Left side mirror, going UP ───────────────────────────

        // left crotch → left hip (rounded lower hip)
        C(pt(-hHW - 2, CROTCH_Y - 10),
          pt(-hHW - 4, HIP_Y + 14),
          pt(-hHW,     HIP_Y)),

        C(pt(-hHW - 6, HIP_Y - 26),
          pt(-wHW - 8, WAIST_Y + 26),
          pt(-wHW,     WAIST_Y)),

        C(pt(-wHW - 8, WAIST_Y - 22),
          pt(-uHW - 6, UNDERBUST_Y + 22),
          pt(-uHW,     UNDERBUST_Y)),

        C(pt(-uHW - 3, UNDERBUST_Y - 14),
          pt(-bHW - 3, BUST_Y + 14),
          pt(-bHW,     BUST_Y)),

        // left bust → left armpit (breast curve mirror)
        C(pt(-bHW - 12, BUST_Y - 6),
          pt(-aHW + 8,  ARMPIT_Y + 12),
          pt(-aHW,      ARMPIT_Y)),

        C(pt(-aHW - 5, ARMPIT_Y - 10),
          pt(-sHW - 2, SHOULDER_Y + 22),
          pt(-sHW,     SHOULDER_Y)),

        C(pt(-sHW - 2,      SHOULDER_Y - 6),
          pt(-NECK_HW - 18, NECK_TOP_Y + 7),
          pt(-NECK_HW,      NECK_TOP_Y)),

        'Z',
      ].join(' ');

      // ── Leg path (side = 1 for right, -1 for left) ───────────────
      function legPath(s) {
        return [
          `M ${pt(s * hHW, CROTCH_Y)}`,

          // outer: hip → knee (tapers in)
          C(pt(s * hHW,   CROTCH_Y + 50),
            pt(s * lKnee, KNEE_Y - 30),
            pt(s * lKnee, KNEE_Y)),

          // outer: knee → ankle (continues tapering)
          C(pt(s * lKnee, KNEE_Y + 30),
            pt(s * lAnkl, ANKLE_Y - 30),
            pt(s * lAnkl, ANKLE_Y)),

          // outer ankle → heel → toe (extends outward)
          C(pt(s * (lAnkl + 2),           ANKLE_Y + 5),
            pt(s * (lAnkl + TOE_EXT - 2), ANKLE_Y + FOOT_H - 5),
            pt(s * (lAnkl + TOE_EXT),     ANKLE_Y + FOOT_H)),

          // toe → inner toe (across ball of foot)
          C(pt(s * (lAnkl + TOE_EXT + 2), ANKLE_Y + FOOT_H + 3),
            pt(s * (liAnkl + 5),           ANKLE_Y + FOOT_H + 3),
            pt(s * (liAnkl + 4),           ANKLE_Y + FOOT_H - 2)),

          // inner toe → inner ankle
          C(pt(s * (liAnkl + 4),  ANKLE_Y + 10),
            pt(s * liAnkl,        ANKLE_Y + 4),
            pt(s * liAnkl,        ANKLE_Y)),

          // inner: ankle → knee
          C(pt(s * liAnkl, ANKLE_Y - 20),
            pt(s * liKnee, KNEE_Y + 20),
            pt(s * liKnee, KNEE_Y)),

          // inner: knee → crotch
          C(pt(s * liKnee, KNEE_Y - 30),
            pt(s * lgap,   CROTCH_Y + 30),
            pt(s * lgap,   CROTCH_Y)),

          'Z',
        ].join(' ');
      }

      // ── Arm path (side = 1 for right, -1 for left) ───────────────
      function armPath(s) {
        const bow = 8;
        return [
          `M ${pt(s * (sHW + 5), SHOULDER_Y + 2)}`,

          // outer: shoulder → elbow (bowing outward)
          C(pt(s * (sHW + 8),       SHOULDER_Y + 50),
            pt(s * (sHW + bow + 6), ELBOW_Y - 30),
            pt(s * (sHW + bow + 5), ELBOW_Y)),

          // outer: elbow → wrist
          C(pt(s * (sHW + bow + 4), ELBOW_Y + 35),
            pt(s * (sHW + 8),       WRIST_Y - 20),
            pt(s * (sHW + 8),       WRIST_Y)),

          // across wrist
          `L ${pt(s * (sHW + 1), WRIST_Y)}`,

          // inner: wrist → elbow
          C(pt(s * (sHW + 1),       WRIST_Y - 20),
            pt(s * (sHW + bow - 2), ELBOW_Y + 35),
            pt(s * (sHW + bow - 3), ELBOW_Y)),

          // inner: elbow → shoulder
          C(pt(s * (sHW + bow - 3), ELBOW_Y - 30),
            pt(s * (sHW + 2),       SHOULDER_Y + 50),
            pt(s * (sHW - 1),       SHOULDER_Y + 2)),

          'Z',
        ].join(' ');
      }

      const fill   = '#fdf6f8';
      const stroke = '#111111';
      const sw     = '1.5';
      const attr   = `fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"`;

      document.getElementById('bodySvg').innerHTML = `
        <path d="${armPath(-1)}" ${attr}/>
        <path d="${armPath(1)}"  ${attr}/>
        <path d="${torso}" ${attr}/>
        <path d="${legPath(1)}"  ${attr}/>
        <path d="${legPath(-1)}" ${attr}/>
        <circle cx="${CX}" cy="${HEAD_Y}" r="${HEAD_R}" ${attr}/>
      `;
    }

    // ── Refined fashion-figure sketch ────────────────────────────────
    // One continuous silhouette avoids the segmented, paper-doll look and
    // keeps every measurement change visible in the proportions of the body.
    function drawBody(bust, underbust, waist, hips) {
      const bHW = hw(bust);
      const uHW = hw(underbust);
      const wHW = hw(waist);
      const hHW = hw(hips);
      const sHW = Math.max(42, bHW * 1.03);
      const armholeHW = bHW * .73;
      const outerThigh = hHW * .82;
      const kneeHW = hHW * .64;
      const ankleHW = Math.max(18, hHW * .45);
      const innerKneeHW = Math.max(11, hHW * .23);
      const innerAnkleHW = Math.max(10, hHW * .20);
      const crotchGap = Math.max(9, hHW * .18);
      const stroke = '#5a3d43';
      const fill = 'url(#body-skin)';

      const armPath = side => [
        `M ${pt(side * (sHW - 2), SHOULDER_Y + 2)}`,
        C(pt(side * (sHW + 13), SHOULDER_Y + 22), pt(side * (sHW + 19), 174), pt(side * (sHW + 15), 226)),
        C(pt(side * (sHW + 13), 253), pt(side * (sHW + 10), 278), pt(side * (sHW + 7), 300)),
        C(pt(side * (sHW + 8), 311), pt(side * (sHW + 12), 318), pt(side * (sHW + 8), 326)),
        C(pt(side * (sHW + 5), 332), pt(side * (sHW - 2), 329), pt(side * (sHW - 1), 320)),
        C(pt(side * (sHW + 2), 293), pt(side * (sHW + 4), 262), pt(side * (sHW + 4), 228)),
        C(pt(side * (sHW + 4), 180), pt(side * (sHW + 2), 132), pt(side * (sHW - 4), SHOULDER_Y + 4)),
        'Z',
      ].join(' ');

      const body = [
        `M ${pt(NECK_HW, NECK_TOP_Y)}`,
        C(pt(NECK_HW + 14, 78), pt(sHW - 4, 91), pt(sHW, SHOULDER_Y)),
        C(pt(sHW + 1, 112), pt(armholeHW + 5, 125), pt(armholeHW, ARMPIT_Y)),
        C(pt(armholeHW - 7, 142), pt(bHW + 7, BUST_Y - 5), pt(bHW, BUST_Y)),
        C(pt(bHW + 1, 168), pt(uHW + 2, 180), pt(uHW, UNDERBUST_Y)),
        C(pt(uHW + 5, 204), pt(wHW + 7, 220), pt(wHW, WAIST_Y)),
        C(pt(wHW + 7, 256), pt(hHW + 5, 278), pt(hHW, HIP_Y)),
        C(pt(hHW + 1, 313), pt(outerThigh + 6, 361), pt(outerThigh, 394)),
        C(pt(outerThigh - 2, 416), pt(kneeHW + 3, 430), pt(kneeHW, KNEE_Y)),
        C(pt(kneeHW - 2, 462), pt(ankleHW + 1, 495), pt(ankleHW, ANKLE_Y)),
        C(pt(ankleHW + 2, 525), pt(ankleHW + 14, 533), pt(ankleHW + 19, 539)),
        C(pt(ankleHW + 22, 544), pt(innerAnkleHW + 7, 548), pt(innerAnkleHW + 2, 539)),
        C(pt(innerAnkleHW, 527), pt(innerAnkleHW, 520), pt(innerAnkleHW, ANKLE_Y)),
        C(pt(innerAnkleHW, 487), pt(innerKneeHW, 456), pt(innerKneeHW, KNEE_Y)),
        C(pt(innerKneeHW, 403), pt(crotchGap + 4, 367), pt(crotchGap, CROTCH_Y + 8)),
        C(pt(crotchGap - 3, CROTCH_Y + 18), pt(7, CROTCH_Y + 20), pt(0, CROTCH_Y + 15)),
        C(pt(-7, CROTCH_Y + 20), pt(-crotchGap + 3, CROTCH_Y + 18), pt(-crotchGap, CROTCH_Y + 8)),
        C(pt(-crotchGap - 4, 367), pt(-innerKneeHW, 403), pt(-innerKneeHW, KNEE_Y)),
        C(pt(-innerKneeHW, 456), pt(-innerAnkleHW, 487), pt(-innerAnkleHW, ANKLE_Y)),
        C(pt(-innerAnkleHW, 520), pt(-innerAnkleHW, 527), pt(-innerAnkleHW - 2, 539)),
        C(pt(-innerAnkleHW - 7, 548), pt(-ankleHW - 22, 544), pt(-ankleHW - 19, 539)),
        C(pt(-ankleHW - 14, 533), pt(-ankleHW - 2, 525), pt(-ankleHW, ANKLE_Y)),
        C(pt(-ankleHW - 1, 495), pt(-kneeHW + 2, 462), pt(-kneeHW, KNEE_Y)),
        C(pt(-kneeHW - 3, 430), pt(-outerThigh + 2, 416), pt(-outerThigh, 394)),
        C(pt(-outerThigh - 6, 361), pt(-hHW - 1, 313), pt(-hHW, HIP_Y)),
        C(pt(-hHW - 5, 278), pt(-wHW - 7, 256), pt(-wHW, WAIST_Y)),
        C(pt(-wHW - 7, 220), pt(-uHW - 5, 204), pt(-uHW, UNDERBUST_Y)),
        C(pt(-uHW - 2, 180), pt(-bHW - 1, 168), pt(-bHW, BUST_Y)),
        C(pt(-bHW - 7, BUST_Y - 5), pt(-armholeHW + 7, 142), pt(-armholeHW, ARMPIT_Y)),
        C(pt(-armholeHW - 5, 125), pt(-sHW - 1, 112), pt(-sHW, SHOULDER_Y)),
        C(pt(-sHW + 4, 91), pt(-NECK_HW - 14, 78), pt(-NECK_HW, NECK_TOP_Y)),
        'Z',
      ].join(' ');

      const hairBack = 'M 124 72 C 116 57 115 38 122 24 C 130 9 146 7 158 12 C 176 18 184 38 178 57 C 176 70 171 81 163 88 L 160 68 C 169 48 167 26 151 22 C 133 19 127 37 132 57 L 137 79 Z';
      const fringe = 'M 128 47 C 128 28 138 17 151 18 C 165 20 171 34 168 49 C 162 43 158 40 153 38 C 147 45 138 49 128 47 Z';
      const collarbone = `M ${pt(-NECK_HW + 1, 83)} C ${pt(-22, 88)} ${pt(-34, 91)} ${pt(-sHW + 6, 99)} M ${pt(NECK_HW - 1, 83)} C ${pt(22, 88)} ${pt(34, 91)} ${pt(sHW - 6, 99)}`;
      const underbustLine = `M ${pt(-uHW + 5, UNDERBUST_Y - 1)} C ${pt(-uHW / 3, UNDERBUST_Y + 5)} ${pt(uHW / 3, UNDERBUST_Y + 5)} ${pt(uHW - 5, UNDERBUST_Y - 1)}`;

      document.getElementById('bodySvg').innerHTML = `
        <defs>
          <linearGradient id="body-skin" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#fff9fa"/>
            <stop offset=".55" stop-color="#f7e7e8"/>
            <stop offset="1" stop-color="#eed5d9"/>
          </linearGradient>
        </defs>
        <path d="${armPath(-1)}" fill="${fill}" stroke="${stroke}" stroke-width="1.35" stroke-linejoin="round"/>
        <path d="${armPath(1)}" fill="${fill}" stroke="${stroke}" stroke-width="1.35" stroke-linejoin="round"/>
        <path d="${body}" fill="${fill}" stroke="${stroke}" stroke-width="1.45" stroke-linejoin="round"/>
        <path d="${hairBack}" fill="#5a3d43" opacity=".92"/>
        <ellipse cx="${CX}" cy="42" rx="21" ry="27" fill="${fill}" stroke="${stroke}" stroke-width="1.35"/>
        <path d="${fringe}" fill="#5a3d43"/>
        <path d="${collarbone}" fill="none" stroke="#b98591" stroke-width=".8" stroke-linecap="round" opacity=".7"/>
        <path d="${underbustLine}" fill="none" stroke="#b98591" stroke-width=".75" stroke-linecap="round" opacity=".65"/>
      `;
    }

    // ── Reactive inputs ──────────────────────────────────────────────
    function redraw() {
      const bust      = parseFloat(document.getElementById('bust').value);
      const underbust = parseFloat(document.getElementById('underbust').value);
      const waist     = parseFloat(document.getElementById('waist').value);
      const hips      = parseFloat(document.getElementById('hips').value);
      if (bust > 0 && underbust > 0 && waist > 0 && hips > 0) {
        drawBody(bust, underbust, waist, hips);
      }
    }

    ['bust', 'underbust', 'waist', 'hips'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById('sizeSelect').value = '';
        redraw();
      });
    });

    // Mean values (midpoint of each range in the size guide table)
    const SIZE_PRESETS = {
      'XXS':      { bust: 80.5, underbust: 66.5, waist: 60,   hips: 87.5  },
      'XS':       { bust: 84.5, underbust: 70.5, waist: 63.5, hips: 91.5  },
      'S':        { bust: 88.5, underbust: 74.5, waist: 67.5, hips: 95.5  },
      'M':        { bust: 92.5, underbust: 78.5, waist: 71.5, hips: 99.5  },
      'L':        { bust: 96.5, underbust: 82.5, waist: 75.5, hips: 103.5 },
      'XL':       { bust: 100.5,underbust: 86.5, waist: 79.5, hips: 107.5 },
      'ONE-SIZE': { bust: 92.5,                  waist: 71.5, hips: 99.5  },
    };

    document.getElementById('sizeSelect').addEventListener('change', function () {
      const preset = SIZE_PRESETS[this.value];
      if (!preset) return;
      if (preset.bust)       document.getElementById('bust').value      = preset.bust;
      if (preset.underbust)  document.getElementById('underbust').value = preset.underbust;
      if (preset.waist)      document.getElementById('waist').value     = preset.waist;
      if (preset.hips)       document.getElementById('hips').value      = preset.hips;
      redraw();
    });

    redraw();
    Store.updateBadge();
  </script>
